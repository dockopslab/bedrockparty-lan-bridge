name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare example configuration
        run: cp .env.example .env

      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.win.yml config --quiet

      - name: Run Python tests
        run: python -m unittest discover -s support/tests -v

      - name: Build production images
        run: docker compose -f compose.win.yml build

      - name: Verify packaged license notices
        run: |
          docker run --rm --entrypoint sh bedrockparty-raknet-proxy:local -c 'test -f /usr/share/licenses/bedrockparty/LICENSE'
          docker run --rm --entrypoint sh bedrockparty-nethernet-bridge:local -c 'test -f /usr/share/licenses/bedrockparty/LICENSE && test -f /usr/share/licenses/bedrockparty/third-party/github.com/coreos/go-oidc/v3/oidc/NOTICE'
